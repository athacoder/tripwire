# Providers "local" (Ollama on localhost) and "mock" are built in.
# Add more here; keys are read from the named environment variable, never stored.
#
# [provider.lmstudio]
# kind     = "openai_compat"
# base_url = "http://localhost:1234/v1"
#
# [provider.groq]
# kind        = "openai_compat"
# base_url    = "https://api.groq.com/openai/v1"
# api_key_env = "GROQ_API_KEY"

# The gated suite: 700 cases, one repetition, a 3-point tolerance.
[suite.banking-intent]
dataset        = "datasets/banking77/gate.jsonl"
target         = "targets/banking_intent.toml"
scorers        = ["exact"]
primary_metric = "exact.pass"
alpha          = 0.05
margin         = 0.03

[suite.banking-intent.guardrails]
output_tokens_ratio_max = 1.25
latency_p95_ratio_max   = 1.50
truncation_rate_max     = 0.01
error_rate_max          = 0.02

# The same target with two repetitions: measures run-to-run noise (tripwire aa, power).
[suite.banking-intent-aa]
dataset = "datasets/banking77/gate.jsonl"
target  = "targets/banking_intent.toml"
reps    = 2

# A deliberately weaker variant, for `tripwire compare`: the few-shot examples removed.
[suite.banking-intent-zero-shot]
dataset = "datasets/banking77/gate.jsonl"
target  = "targets/banking_intent_zero_shot.toml"

[suite.banking-intent-dev]
dataset = "datasets/banking77/dev.jsonl"
target  = "targets/banking_intent.toml"

# Structured extraction with a continuous metric. Answers are known by construction.
[suite.invoice-extract]
dataset        = "datasets/invoices/extract.jsonl"
target         = "targets/invoice_extract.toml"
scorers        = ["field_f1"]
primary_metric = "field_f1.f1"

# Grounded question answering, scored by an LLM judge. `fact` is a rule-based check of
# the same thing, kept as an independent reference for the judge.
[suite.policy-qa]
dataset        = "datasets/policy_qa/qa.jsonl"
target         = "targets/policy_qa.toml"
scorers        = ["fact", "judge"]
primary_metric = "judge.correct"

# The judge grades one criterion per call. It is a different model family from the
# systems under test, and runs at temperature 0.
[judge]
model    = "qwen2.5:7b"
system   = "prompts/judge/system.md"
template = "prompts/judge/user.md"
rubric   = "prompts/judge/rubric.toml"

# The same task with the "say so if the documents do not cover it" instruction removed.
[suite.policy-qa-no-abstain]
dataset        = "datasets/policy_qa/qa.jsonl"
target         = "targets/policy_qa_no_abstain.toml"
scorers        = ["fact", "judge"]
primary_metric = "judge.correct"
