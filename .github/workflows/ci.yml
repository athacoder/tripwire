name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The dashboard is an optional extra; it is installed here so that its tests run.
      - run: pip install -e ".[dev,dashboard]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      # The committed data must stay clean and must not leak into the prompts.
      - run: |
          for split in dev gate reference robust; do
            tripwire dataset lint datasets/banking77/$split.jsonl --prompts prompts/banking_intent
          done
          tripwire dataset lint datasets/invoices/extract.jsonl --prompts prompts/invoice_extract
          tripwire dataset lint datasets/policy_qa/qa.jsonl --prompts prompts/policy_qa
          tripwire selfcheck banking-intent
          tripwire selfcheck invoice-extract

  # The dashboard's image: build it, mount the repository as the project, and check that
  # the page is served. The results it shows are the packed copy of the benchmark's.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tripwire-dashboard .
      - run: |
          gunzip -c demo/tripwire-demo.db.gz > tripwire.db
          docker run -d --name dashboard -p 8501:8501 -v "$PWD:/project" \
            tripwire-dashboard --config experiments/zoo.toml
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:8501/_stcore/health && break
            sleep 2
          done
          docker logs dashboard
          curl -fs http://localhost:8501/_stcore/health | grep -q ok
