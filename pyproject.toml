[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire-eval"
version = "0.1.0"
description = "A statistical regression gate for LLM systems."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Atharva Shahagadkar" }]
dependencies = [
    "httpx>=0.27",
    "numpy>=2.1",
    "scipy>=1.15",
    "pydantic>=2.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "scipy-stubs"]

[project.scripts]
tripwire = "tripwire.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # generator templates read better as one line each
"experiments/*" = ["E501"]  # so do report tables and SVG elements

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
